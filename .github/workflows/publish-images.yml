name: Publish images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image namespace
        run: echo "IMAGE_NAMESPACE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/voicera-api:${{ github.ref_name }}
            ${{ env.IMAGE_NAMESPACE }}/voicera-api:latest

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/runtime/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/voicera-runtime:${{ github.ref_name }}
            ${{ env.IMAGE_NAMESPACE }}/voicera-runtime:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/voicera-frontend:${{ github.ref_name }}
            ${{ env.IMAGE_NAMESPACE }}/voicera-frontend:latest
